      plane_eigen_value_thre: [4.0, 4.0, 4.0, 4.0]
      imu_coef: 0.0002
      thread_num: 5
    Loop:
      jud_default: 0.45
      icp_eigval: 9.0
      ratio_drift: 0.01
    GBA:
      voxel_size: 2.0
      min_eigen_value: 0.01
      eigen_value_array: [4.0, 4.0, 4.0, 4.0]
      total_max_iter: 6
    MapBlock:
      size_x: 20.0
      size_y: 20.0
      size_z: 10.0
      fusion_leaf_size: 0.1
      root_voxel_size: 1.0
      max_layer: 2
      min_eigen_value: 0.0025
      save_display_cloud: false
